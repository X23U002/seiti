# プルリクエストと main への push で、自動テストを動かす
name: テスト

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: キャッシュ用の番号（?v=）が最新か
        run: python3 tools/update_versions.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            worker/package-lock.json

      - name: AI プランの中継サーバーのテスト
        working-directory: worker
        run: |
          npm ci
          npm test

      - name: テストの道具を入れる
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 画面のテスト
        working-directory: tests
        run: npm test

      - name: 失敗した時の記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
