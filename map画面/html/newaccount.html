<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/newaccount.css">
    <!-- ログイン（Firebase Authentication） -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" id="back-btn" onclick="goBack()" aria-label="前の画面に戻る">＜ 戻る</button>
        <h1>新規登録</h1>
    </header>

    <main class="content">
        <!-- 進捗表示 -->
        <ol class="steps" aria-label="登録の流れ">
            <li class="step active" id="step-input" aria-current="step"><span>1</span>入力</li>
            <li class="step" id="step-confirm"><span>2</span>確認</li>
            <li class="step" id="step-done"><span>3</span>完了</li>
        </ol>

        <!-- =============== 1. 入力 =============== -->
        <form class="card" id="input-section" onsubmit="goToConfirm(); return false;" novalidate>
            <div class="form-group">
                <label for="username">名前<span class="required">必須</span></label>
                <input type="text" id="username" placeholder="(例) 田中太郎" autocomplete="name">
                <p class="error-text">名前を入力してください。</p>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス<span class="required">必須</span></label>
                <input type="email" id="email" placeholder="(例) seiti150@seiti.ac.jp" autocomplete="email">
                <p class="form-hint">ログインとパスワードの再設定に使います。</p>
                <p class="error-text">正しいメールアドレスを入力してください。</p>
            </div>

            <div class="form-group">
                <label for="password">パスワード<span class="required">必須</span></label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="英数字8文字以上" autocomplete="new-password" aria-describedby="password-hint">
                    <button type="button" class="password-toggle" data-target="password" aria-pressed="false" aria-label="パスワードを表示">表示</button>
                </div>
                <p class="form-hint" id="password-hint">英数字8文字以上（記号は使えません）</p>
                <p class="error-text">英数字8文字以上で入力してください。</p>
            </div>

            <div class="form-group">
                <label for="password-confirm">パスワード（確認）<span class="required">必須</span></label>
                <input type="password" id="password-confirm" placeholder="もう一度入力" autocomplete="new-password">
                <p class="error-text">パスワードが一致しません。</p>
            </div>

            <!-- 登録確認へ進むボタン -->
            <button type="submit" class="btn btn-primary">登録内容の確認へ</button>
        </form>

        <!-- =============== 2. 確認 =============== -->
        <section id="confirm-section" hidden>
            <div class="instruction">
                <p>以下の内容で登録します。間違いがなければ「登録する」を押してください。</p>
            </div>

            <!-- 登録に失敗した時のメッセージ -->
            <p class="form-error" id="register-error" role="alert" hidden></p>

            <dl class="confirm-box card">
                <div class="info-group">
                    <dt class="info-label">名前</dt>
                    <dd class="info-text" id="confirm-name"></dd>
                </div>
                <div class="info-group">
                    <dt class="info-label">メールアドレス</dt>
                    <dd class="info-text" id="confirm-email"></dd>
                </div>
                <div class="info-group">
                    <dt class="info-label">パスワード</dt>
                    <dd class="info-text" id="confirm-password"></dd>
                </div>
            </dl>

            <button type="button" class="btn btn-success" id="register-btn" onclick="register()">登録する</button>
            <button type="button" class="btn btn-secondary edit-btn" onclick="showInput()">入力内容を修正する</button>
        </section>
    </main>

    <!-- =============== 3. 完了のポップアップ =============== -->
    <div id="complete-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="complete-title">
        <div class="modal-content complete-box">
            <div class="complete-icon" aria-hidden="true">✓</div>
            <h2 class="complete-title" id="complete-title">登録が完了しました</h2>
            <p class="complete-text">さっそく地図から聖地を探してみましょう。</p>
            <button type="button" class="btn btn-primary" onclick="goToMap()" data-modal-close>マップへ進む</button>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/newaccount.js"></script>
</body>
</html>
