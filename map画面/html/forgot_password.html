<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再発行 - 聖地巡礼NAVI</title>
    <!-- cssフォルダにあるforgot_password.cssを読み込む -->
    <link rel="stylesheet" href="../css/forgot_password.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button class="back-btn" onclick="goToLogin()">＜ 戻る</button>
        <h1>パスワード再発行</h1>
    </header>

    <div class="content">
        <!-- 案内テキスト -->
        <div class="instruction">
            <p>名前とメールアドレスを入力してください。</p>
        </div>

        <!-- 入力フォーム -->
        <div class="form-group">
            <label for="username">名前</label>
            <input type="text" id="username" placeholder="(例) 田中太郎">
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" placeholder="(例) seiti150@seiti.ac.jp">
        </div>

        <!-- 再発行ボタン -->
        <button class="submit-btn" onclick="submitReissue()">パスワード再発行</button>
    </div>

    <!-- =============== 送信完了のポップアップ（モーダル） =============== -->
    <div id="completion-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title">パスワード再発行</h2>
            <p class="modal-text">ご入力いただいたメールアドレスに再発行のメールを送信しますのでメールをご確認ください。</p>
            <button class="close-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <!-- jsフォルダにあるforgot_password.jsを読み込む -->
    <script src="../js/forgot_password.js"></script>
</body>
</html>
