<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再発行 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css?v=c79053d9">
    <link rel="stylesheet" href="../css/forgot_password.css?v=9224aaac">
    <!-- アプリとして使う（ホーム画面に追加・オフライン。pwa.js） -->
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0b3c5d">
    <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="../images/icons/icon-192.png">
    <script src="../js/pwa.js?v=c08113cc" defer></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" onclick="goToLogin()" aria-label="ログイン画面に戻る">＜ 戻る</button>
        <h1>パスワード再発行</h1>
    </header>

    <main class="content">
        <!-- 案内テキスト -->
        <div class="instruction">
            <p>登録したメールアドレスを入力してください。再発行用のメールをお送りします。</p>
        </div>

        <!-- 入力フォーム -->
        <form class="card" id="reissue-form" novalidate>
            <p class="form-alert" id="reissue-error" role="alert" hidden></p>
            <div class="form-group">
                <label for="email">メールアドレス<span class="required">必須</span></label>
                <input type="email" id="email" placeholder="(例) seiti150@seiti.ac.jp" autocomplete="email">
                <p class="error-text">正しいメールアドレスを入力してください。</p>
            </div>

            <!-- 再発行ボタン -->
            <button type="submit" class="btn btn-primary" id="reissue-btn">再発行メールを送る</button>
        </form>
    </main>

    <!-- =============== 送信完了のポップアップ（モーダル） =============== -->
    <div id="completion-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="completion-title">
        <div class="modal-content complete-box">
            <div class="complete-icon" aria-hidden="true">✉</div>
            <h2 class="complete-title" id="completion-title">メールを送信しました</h2>
            <p class="complete-text">ご入力いただいたメールアドレスが登録されていれば、パスワード再設定用のメールが届きます。メールのリンクから新しいパスワードを設定してください。</p>
            <button type="button" class="btn btn-primary" onclick="closeModal()" data-modal-close>ログイン画面へ</button>
        </div>
    </div>

    <script src="../js/common.js?v=bdcf06ca"></script>
    <script type="module" src="../js/forgot_password.js?v=88ef311a"></script>
</body>
</html>
