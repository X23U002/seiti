<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再発行 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/forgot_password.css">
    <!-- ログイン（Firebase Authentication） -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" onclick="goToLogin()" aria-label="ログイン画面に戻る">＜ 戻る</button>
        <h1>パスワード再発行</h1>
    </header>

    <main class="content">
        <!-- 案内テキスト -->
        <div class="instruction">
            <p>登録したメールアドレスを入力してください。パスワードを再設定するためのメールをお送りします。</p>
        </div>

        <!-- 入力フォーム -->
        <form class="card" onsubmit="submitReissue(); return false;" novalidate>
            <!-- 送信に失敗した時のメッセージ -->
            <p class="form-error" id="reset-error" role="alert" hidden></p>
            <div class="form-group">
                <label for="email">メールアドレス<span class="required">必須</span></label>
                <input type="email" id="email" placeholder="(例) seiti150@seiti.ac.jp" autocomplete="email">
                <p class="error-text">正しいメールアドレスを入力してください。</p>
            </div>

            <!-- 再発行ボタン -->
            <button type="submit" class="btn btn-primary" id="reset-btn">再設定メールを送る</button>
        </form>
    </main>

    <!-- =============== 送信完了のポップアップ（モーダル） =============== -->
    <div id="completion-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="completion-title">
        <div class="modal-content complete-box">
            <div class="complete-icon" aria-hidden="true">✉</div>
            <h2 class="complete-title" id="completion-title">メールを送信しました</h2>
            <p class="complete-text">ご入力いただいたメールアドレスが登録されていれば、パスワード再設定のメールが届きます。メールのリンクから新しいパスワードを設定してください。<br>届かない場合は迷惑メールフォルダもご確認ください。</p>
            <button type="button" class="btn btn-primary" onclick="closeModal()" data-modal-close>ログイン画面へ</button>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/forgot_password.js"></script>
</body>
</html>
