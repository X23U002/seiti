<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <!-- ログイン（Firebase Authentication） -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <main class="login-container">
        <div class="app-logo" aria-hidden="true">⛩️</div>
        <h1 class="app-title">聖地巡礼NAVI</h1>
        <p class="app-catch">アニメの聖地をめぐって、スタンプを集めよう</p>

        <!-- formにしてEnterキーでもログインできるようにする -->
        <form class="login-form" onsubmit="login(); return false;" novalidate>
            <!-- ログインに失敗した時のメッセージ -->
            <p class="form-error" id="login-error" role="alert" hidden></p>

            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" placeholder="(例) seiti150@seiti.ac.jp" autocomplete="email">
                <p class="error-text">メールアドレスを入力してください。</p>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="password" aria-pressed="false" aria-label="パスワードを表示">表示</button>
                </div>
                <p class="error-text">パスワードを入力してください。</p>
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn">ログイン</button>
        </form>

        <div class="links">
            <a href="forgot_password.html">パスワードを忘れた場合</a>
        </div>

        <div class="divider"><span>はじめての方</span></div>

        <a href="newaccount.html" class="btn btn-secondary">新規登録</a>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
