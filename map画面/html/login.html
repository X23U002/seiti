<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="app-logo" aria-hidden="true">⛩️</div>
        <h1 class="app-title">聖地巡礼NAVI</h1>
        <p class="app-catch">アニメの聖地をめぐって、スタンプを集めよう</p>

        <!-- formにしてEnterキーでもログインできるようにする -->
        <form class="login-form" onsubmit="goToMap(); return false;">
            <div class="form-group">
                <label for="userid">ユーザーID</label>
                <input type="text" id="userid" placeholder="(例) u1" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="(例) seiti555" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="password" aria-pressed="false" aria-label="パスワードを表示">表示</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">ログイン</button>
        </form>

        <div class="links">
            <a href="forgot_password.html">パスワードを忘れた場合</a>
        </div>

        <div class="divider"><span>はじめての方</span></div>

        <a href="newaccount.html" class="btn btn-secondary">新規登録</a>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
