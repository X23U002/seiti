<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/mypage.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button class="back-btn" onclick="goToMap()">＜ マップに戻る</button>
        <h1>マイページ</h1>
    </header>

    <div class="content">
        <!-- ユーザープロフィール部分 -->
        <div class="profile-card">
            <!-- JSで変更できるようにIDを追加 -->
            <div class="profile-icon" id="current-icon">👤</div>
            <div class="profile-info">
                <!-- JSで変更できるようにIDを追加 -->
                <h2 class="user-name" id="current-name">田中 太郎</h2>
                <p class="user-id">ID: u1</p>
            </div>
            <!-- 編集ボタンを追加 -->
            <button class="edit-profile-btn" onclick="openEditModal()">編集</button>
        </div>

        <!-- メニューリスト -->
        <div class="menu-list">
            <button class="menu-item" onclick="goToHistory()">
                <span>🕒 巡礼履歴・ルート案内</span>
                <span>＞</span>
            </button>
            
            <button class="menu-item" onclick="goToStamp()">
                <span>💮 獲得スタンプ一覧</span>
                <span>＞</span>
            </button>

            <!-- ログアウトボタン -->
            <button class="menu-item logout" onclick="logout()">
                <span>ログアウト</span>
            </button>
        </div>
    </div>

    <!-- =============== プロフィール編集のポップアップ =============== -->
    <div id="edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close-btn" onclick="closeEditModal()">✖</span>
            <h2 class="modal-title">プロフィール編集</h2>
            
            <!-- 名前入力 -->
            <div class="form-group">
                <label>名前</label>
                <input type="text" id="edit-name-input" value="田中 太郎">
            </div>

            <!-- アイコン選択（候補をいくつか用意） -->
            <div class="form-group">
                <label>アイコン選択</label>
                <div class="icon-grid">
                    <!-- this は「クリックされた要素自身」をJSに渡す魔法の言葉です -->
                    <div class="icon-option selected" onclick="selectIcon(this, '👤')">👤</div>
                    <div class="icon-option" onclick="selectIcon(this, '🐶')">🐶</div>
                    <div class="icon-option" onclick="selectIcon(this, '🐱')">🐱</div>
                    <div class="icon-option" onclick="selectIcon(this, '🦊')">🦊</div>
                    <div class="icon-option" onclick="selectIcon(this, '🐻')">🐻</div>
                    <div class="icon-option" onclick="selectIcon(this, '🐸')">🐸</div>
                </div>
            </div>

            <!-- 保存ボタン -->
            <button class="save-btn" onclick="saveProfile()">保存する</button>
        </div>
    </div>

    <script src="../js/mypage.js"></script>
</body>
</html>
