<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録確認 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/newaccount.css">
    <link rel="stylesheet" href="../css/confirm.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" onclick="goToRegister()" aria-label="入力画面に戻る">＜ 修正する</button>
        <h1>登録確認</h1>
    </header>

    <main class="content">
        <!-- 進捗表示 -->
        <ol class="steps" aria-label="登録の流れ">
            <li class="step done"><span>✓</span>入力</li>
            <li class="step active" aria-current="step"><span>2</span>確認</li>
            <li class="step"><span>3</span>完了</li>
        </ol>

        <!-- 案内テキスト -->
        <div class="instruction">
            <p>以下の内容で登録します。間違いがなければ「登録する」を押してください。</p>
        </div>

        <!-- 確認内容の表示 -->
        <dl class="confirm-box card">
            <div class="info-group">
                <dt class="info-label">ニックネーム（アプリ内で表示）</dt>
                <dd class="info-text" id="confirm-nickname">せいち巡礼者</dd>
            </div>

            <div class="info-group">
                <dt class="info-label">メールアドレス</dt>
                <dd class="info-text" id="confirm-email">seiti150@seiti.ac.jp</dd>
            </div>

            <div class="info-group">
                <dt class="info-label">パスワード</dt>
                <dd class="info-text" id="confirm-password">********</dd>
            </div>
        </dl>

        <!-- 登録完了へ進むボタン -->
        <button type="button" class="btn btn-success" onclick="goToComplete()">登録する</button>
        <button type="button" class="btn btn-secondary edit-btn" onclick="goToRegister()">入力内容を修正する</button>
    </main>

    <!-- =============== 登録完了のポップアップ =============== -->
    <div id="complete-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="complete-title">
        <div class="modal-content complete-box">
            <div class="complete-icon" aria-hidden="true">✓</div>
            <h2 class="complete-title" id="complete-title">登録が完了しました</h2>
            <p class="complete-text">さっそく地図から聖地を探してみましょう。</p>
            <button type="button" class="btn btn-primary" onclick="goToMap()" data-modal-close>マップへ進む</button>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/confirm.js"></script>
</body>
</html>
