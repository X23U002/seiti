<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/information.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <a href="map.html" class="back-btn" aria-label="マップに戻る">＜ マップ</a>
        <h1>お問い合わせ</h1>
    </header>

    <main class="content">

        <!-- =====================================
             お問い合わせ入力画面
        ===================================== -->
        <div id="formPage">
            <div class="instruction">
                <p>不具合・ご意見・ご要望などをご入力ください。返信が必要な場合は、登録したメールアドレスにお送りします。</p>
            </div>

            <!-- 未ログインの時 -->
            <div class="card empty-state" id="contact-login" hidden>
                <div class="empty-state-icon">🔑</div>
                <p>お問い合わせにはログインが必要です</p>
                <small>返信は登録したメールアドレスにお送りします</small>
                <a href="login.html" class="btn btn-primary">ログインする</a>
            </div>

            <form class="card" id="contact-form" novalidate>
                <p class="form-alert" id="contact-error" role="alert" hidden></p>

                <div class="form-group">
                    <label for="contactText">お問い合わせ内容<span class="required">必須</span></label>
                    <textarea id="contactText" placeholder="お問い合わせ内容を入力してください" maxlength="2000"></textarea>
                    <p class="error-text">お問い合わせ内容を入力してください（2000文字以内）。</p>
                </div>

                <button type="submit" class="btn btn-primary" id="contact-btn">送信する</button>
            </form>
        </div>

        <!-- =====================================
             送信完了画面
        ===================================== -->
        <div id="completePage" class="card complete-box" style="display:none;">
            <div class="complete-icon" aria-hidden="true">✓</div>
            <h2 class="complete-title">送信が完了しました</h2>
            <p class="complete-text">
                お問い合わせいただき、ありがとうございました。<br>
                運営で内容を確認後、必要に応じて返信いたします。<br>
                今後も当アプリをご愛用いただけますと幸いです。
            </p>
            <a href="map.html" class="btn btn-primary">マップに戻る</a>
        </div>

    </main>

    <script src="../js/common.js"></script>
    <script type="module" src="../js/information.js?v=4"></script>
</body>
</html>
