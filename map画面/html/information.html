<!DOCTYPE html>
<html lang="ja" data-require-login>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/information.css">
    <!-- ログイン（Firebase Authentication） -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <a href="map.html" class="back-btn" aria-label="マップに戻る">＜ マップ</a>
        <h1>お問い合わせ</h1>
    </header>

    <main class="content">

        <!-- =====================================
             お問い合わせ入力画面
        ===================================== -->
        <div id="formPage">
            <div class="instruction">
                <p>不具合・ご意見・ご要望などをご入力ください。</p>
            </div>

            <form class="card" onsubmit="sendContact(); return false;" novalidate>
                <div class="form-group">
                    <label for="contactText">お問い合わせ内容<span class="required">必須</span></label>
                    <textarea id="contactText" placeholder="お問い合わせ内容を入力してください"></textarea>
                    <p class="error-text">お問い合わせ内容を入力してください。</p>
                </div>

                <div class="form-group">
                    <span class="form-label">画像<span class="optional">任意</span></span>
                    <label class="file-input">
                        <span class="file-input-icon" aria-hidden="true">🖼</span>
                        <span class="file-input-text">タップして画像を選択</span>
                        <input type="file" id="image" accept="image/*" data-preview="image-preview">
                    </label>
                    <img id="image-preview" class="file-preview" alt="選択した画像のプレビュー">
                    <p class="form-hint">スクリーンショットなどがある場合は添付してください。</p>
                </div>

                <button type="submit" class="btn btn-primary">送信する</button>
            </form>
        </div>

        <!-- =====================================
             送信完了画面
        ===================================== -->
        <div id="completePage" class="card complete-box" style="display:none;">
            <div class="complete-icon" aria-hidden="true">✓</div>
            <h2 class="complete-title">送信が完了しました</h2>
            <p class="complete-text">
                お問い合わせいただき、ありがとうございました。<br>
                運営で内容を確認後、必要に応じて返信いたします。<br>
                今後も当アプリをご愛用いただけますと幸いです。
            </p>
            <a href="map.html" class="btn btn-primary">マップに戻る</a>
        </div>

    </main>

    <script src="../js/common.js"></script>
    <script src="../js/information.js"></script>
</body>
</html>
