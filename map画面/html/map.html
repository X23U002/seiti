<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>聖地巡礼NAVI</title>

    <!-- Mapbox -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>

    <!-- Mapbox Geocoder -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

    <!-- three.js（現在地の3Dキャラクター表示に使う） -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
            }
        }
    </script>

    <!-- 自作CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>
        .popup-img {
            width: 100%;
            max-width: 200px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- 地図 -->
    <div id="map"></div>


    <!-- 左サイドメニュー -->
    <nav id="side-menu" aria-label="メニュー">

        <div class="side-menu-header">

            <span class="side-menu-logo">⛩️ 聖地巡礼NAVI</span>

            <button
                id="close-menu"
                type="button"
                onclick="toggleMenu()"
                aria-label="メニューを閉じる"
            >
                ✕
            </button>

        </div>

        <ul>
            <li>
                <a href="mypage.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>マイページ</a>
            </li>

            <li>
                <a href="stamp.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>獲得スタンプ</a>
            </li>

            <li>
                <a href="register.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg>聖地登録</a>
            </li>

            <li>
                <a href="information.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>お問い合わせ</a>
            </li>

            <li>
                <a href="guide.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>操作ガイド</a>
            </li>
        </ul>

    </nav>

    <!-- メニュー表示中の背景（タップで閉じる） -->
    <div
        id="menu-backdrop"
        onclick="toggleMenu()"
    ></div>


    <!-- ハンバーガーボタン -->
    <button
        id="hamburger-btn"
        type="button"
        onclick="toggleMenu()"
        aria-label="メニューを開く"
        aria-controls="side-menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>


    <!-- 検索バー -->
    <div id="search-container"></div>


    <!-- マイページボタン -->
    <button
        id="profile-btn"
        type="button"
        onclick="location.href='mypage.html'"
        aria-label="マイページ"
        title="マイページ"
    >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </button>


    <!-- 絞り込みボタンと、絞り込み中の作品の札（× で外せる） -->
    <div id="filter-bar">

        <button
            id="filter-btn"
            type="button"
            onclick="openFilter()"
        >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
            作品で絞り込み
        </button>

        <div
            id="filter-chips"
            aria-live="polite"
        ></div>

    </div>


    <!-- アニメ絞り込み画面 -->
    <div id="filter-modal">

        <div class="filter-header">

            <h2>作品で絞り込み</h2>

            <button
                type="button"
                onclick="closeFilter()"
                aria-label="閉じる"
            >
                ✕
            </button>

        </div>

        <input
            type="text"
            id="anime-search"
            placeholder="作品名で検索"
            aria-label="作品名で検索"
            onkeyup="searchAnime()"
        >

        <p class="filter-note">ピンの色は作品ごとに決まっています。</p>

        <div id="anime-list"></div>

        <div class="filter-buttons">

            <button
                id="filter-reset"
                type="button"
                onclick="resetFilter()"
            >
                リセット
            </button>

            <button
                id="filter-ok"
                type="button"
                onclick="applyFilter()"
            >
                決定
            </button>

        </div>

    </div>


    <!-- 絞り込み表示中の背景（タップで閉じる） -->
    <div
        id="filter-backdrop"
        onclick="closeFilter()"
    ></div>


    <!-- 現在地 -->
    <button
        id="location-btn"
        type="button"
        onclick="moveToCurrentLocation()"
        aria-label="現在地へ移動"
        title="現在地へ移動"
    >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>


    <!-- 2D・3D -->
    <button
        id="toggle-view-btn"
        type="button"
        onclick="toggleView()"
        aria-label="3D表示"
        aria-pressed="false"
    >
        <span class="seg seg-2d">2D</span>
        <span class="seg seg-3d">3D</span>
    </button>


    <!-- 経路案内パネル -->
    <div
        id="routePanel"
        style="display:none;"
    >

        <div class="route-header">

            <!-- 押すと一覧を折りたたむ／広げる -->
            <button
                id="route-toggle"
                type="button"
                aria-expanded="true"
                aria-controls="route-body"
                onclick="toggleRoutePanel()"
            >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>
                <span>ルート案内</span>
                <span
                    id="route-count"
                    class="route-count"
                >0</span>
                <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <button
                id="clear-route"
                type="button"
            >
                全削除
            </button>

        </div>

        <div id="route-body">

            <div id="routeList">
                <!-- 追加したスポットが表示される -->
            </div>

            <button
                id="open-google-route"
                type="button"
            >
                Googleマップで案内
            </button>

        </div>

    </div>


    <!-- =====================================================
         Firebase compat
         必ずstampsyori.jsより先に読み込む
    ====================================================== -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>


    <!-- =====================================================
         スタンプ処理
         type="module"は付けない
    ====================================================== -->
    <!-- 画面下の通知メッセージ（stampsyori.js・Script.jsから使う） -->
    <script src="../js/toast.js"></script>

    <script src="../js/stampsyori.js"></script>


    <!-- =====================================================
         地図・Firestoreスポット読込
         stampsyori.jsより後に読み込む
    ====================================================== -->
    <script
        type="module"
        src="../js/Script.js"
    ></script>


    <!-- Escキーでメニュー・絞り込みを閉じる／ルート案内の折りたたみ -->
    <script>
        function toggleRoutePanel() {
            const panel = document.getElementById("routePanel");
            const collapsed = panel.classList.toggle("collapsed");
            document.getElementById("route-toggle").setAttribute("aria-expanded", String(!collapsed));
        }

        document.addEventListener("keydown", function (event) {
            if (event.key !== "Escape") return;

            if (document.getElementById("side-menu").classList.contains("open")) {
                window.toggleMenu();
            }

            if (document.getElementById("filter-modal").style.display === "block") {
                window.closeFilter();
            }
        });
    </script>

</body>

</html>
