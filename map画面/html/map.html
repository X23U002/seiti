<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>聖地巡礼NAVI</title>

    <!-- Mapbox -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>

    <!-- Mapbox Geocoder -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

    <!-- three.js（現在地の3Dキャラクター表示に使う） -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
            }
        }
    </script>

    <!-- 自作CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>
        .popup-img {
            width: 100%;
            max-width: 200px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- 地図 -->
    <div id="map"></div>


    <!-- 左サイドメニュー -->
    <nav id="side-menu" aria-label="メニュー">

        <div class="side-menu-header">

            <span class="side-menu-logo">⛩️ 聖地巡礼NAVI</span>

            <button
                id="close-menu"
                type="button"
                onclick="toggleMenu()"
                aria-label="メニューを閉じる"
            >
                ✕
            </button>

        </div>

        <ul>
            <li>
                <a href="mypage.html"><span aria-hidden="true">👤</span>マイページ</a>
            </li>

            <li>
                <a href="stamp.html"><span aria-hidden="true">💮</span>獲得スタンプ</a>
            </li>

            <li>
                <a href="register.html"><span aria-hidden="true">📍</span>聖地登録</a>
            </li>

            <li>
                <a href="information.html"><span aria-hidden="true">✉</span>お問い合わせ</a>
            </li>

            <li>
                <a href="guide.html"><span aria-hidden="true">📖</span>操作ガイド</a>
            </li>
        </ul>

    </nav>

    <!-- メニュー表示中の背景（タップで閉じる） -->
    <div
        id="menu-backdrop"
        onclick="toggleMenu()"
    ></div>


    <!-- ハンバーガーボタン -->
    <button
        id="hamburger-btn"
        type="button"
        onclick="toggleMenu()"
        aria-label="メニューを開く"
        aria-controls="side-menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>


    <!-- 検索バー -->
    <div id="search-container"></div>


    <!-- マイページボタン -->
    <button
        id="profile-btn"
        type="button"
        onclick="location.href='mypage.html'"
        aria-label="マイページ"
        title="マイページ"
    >
        👤
    </button>


    <!-- 絞り込みボタン -->
    <button
        id="filter-btn"
        type="button"
        onclick="openFilter()"
    >
        🎬 アニメで絞り込み
    </button>


    <!-- アニメ絞り込み画面 -->
    <div id="filter-modal">

        <div class="filter-header">

            <h2>アニメで絞り込み</h2>

            <button
                type="button"
                onclick="closeFilter()"
                aria-label="閉じる"
            >
                ✕
            </button>

        </div>

        <input
            type="text"
            id="anime-search"
            placeholder="🔍 作品名で検索"
            aria-label="作品名で検索"
            onkeyup="searchAnime()"
        >

        <div id="anime-list"></div>

        <div class="filter-buttons">

            <button
                id="filter-reset"
                type="button"
                onclick="resetFilter()"
            >
                リセット
            </button>

            <button
                id="filter-ok"
                type="button"
                onclick="applyFilter()"
            >
                決定
            </button>

        </div>

    </div>


    <!-- 絞り込み表示中の背景（タップで閉じる） -->
    <div
        id="filter-backdrop"
        onclick="closeFilter()"
    ></div>


    <!-- 現在地 -->
    <button
        id="location-btn"
        type="button"
        onclick="moveToCurrentLocation()"
        aria-label="現在地へ移動"
        title="現在地へ移動"
    >
        📍
    </button>


    <!-- 2D・3D -->
    <button
        id="toggle-view-btn"
        type="button"
        onclick="toggleView()"
        aria-label="2D・3D表示の切り替え"
    >
        🔄 3D
    </button>


    <!-- 経路案内パネル -->
    <div
        id="routePanel"
        style="display:none;"
    >

        <div class="route-header">

            <h3>📍 ルート案内</h3>

            <button
                id="clear-route"
                type="button"
            >
                全削除
            </button>

        </div>

        <div id="routeList">
            <!-- 追加したスポットが表示される -->
        </div>

        <button
            id="open-google-route"
            type="button"
        >
            Googleマップで案内
        </button>

    </div>


    <!-- =====================================================
         Firebase compat
         必ずstampsyori.jsより先に読み込む
    ====================================================== -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>


    <!-- =====================================================
         スタンプ処理
         type="module"は付けない
    ====================================================== -->
    <!-- 画面下の通知メッセージ（stampsyori.js・Script.jsから使う） -->
    <script src="../js/toast.js"></script>

    <script src="../js/stampsyori.js"></script>


    <!-- =====================================================
         地図・Firestoreスポット読込
         stampsyori.jsより後に読み込む
    ====================================================== -->
    <script
        type="module"
        src="../js/Script.js"
    ></script>


    <!-- Escキーでメニュー・絞り込みを閉じる -->
    <script>
        document.addEventListener("keydown", function (event) {
            if (event.key !== "Escape") return;

            if (document.getElementById("side-menu").classList.contains("open")) {
                window.toggleMenu();
            }

            if (document.getElementById("filter-modal").style.display === "block") {
                window.closeFilter();
            }
        });
    </script>

</body>

</html>
