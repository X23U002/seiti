<!DOCTYPE html>
<html lang="ja" data-require-login>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獲得スタンプ - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/stamp.css">
    <!-- ログイン（Firebase Authentication） -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" onclick="goToMyPage()" aria-label="マイページに戻る">＜ 戻る</button>
        <h1>獲得スタンプ</h1>
    </header>

    <main class="content">
        <!-- 獲得数と絞り込み -->
        <div class="toolbar">
            <p class="stamp-count" aria-live="polite"><strong id="stamp-count">0</strong> 個 獲得</p>
            <button type="button" class="filter-btn" id="filter-toggle" onclick="toggleFilter()" aria-expanded="false" aria-controls="filter-menu">
                <span aria-hidden="true">🎛</span> 作品で絞り込み
                <span class="filter-active-count" id="filter-active-count" hidden></span>
                <span class="chevron" aria-hidden="true">▾</span>
            </button>
        </div>

        <!-- 絞り込みメニュー（最初は隠しておく） -->
        <div id="filter-menu" class="filter-dropdown" style="display: none;">
        </div>

        <!-- スタンプ一覧 -->
        <div class="stamp-container">
            <div id="stampList" class="stamp-grid">
            </div>
        </div>
    </main>

    <!-- =============== スタンプ詳細のポップアップ（モーダル） =============== -->
    <div id="stamp-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content stamp-detail">
            <button type="button" class="modal-close-btn" onclick="closeStampModal()" aria-label="閉じる" data-modal-close>✕</button>

            <div class="stamp-big-circle" aria-hidden="true">⛩️</div>
            <h2 id="modal-title" class="spot-title">〇〇神社</h2>
            <div id="modal-date" class="visit-date">訪問日時：2026年05月15日</div>

            <dl class="info-group">
                <dt class="info-label">🎬 作品名</dt>
                <dd class="info-text" id="modal-anime">アニメ名</dd>

                <dt class="info-label">📺 シーン</dt>
                <dd class="info-text" id="modal-scene">シーン</dd>

                <dt class="info-label">📍 住所</dt>
                <dd class="info-text" id="modal-address">住所</dd>
            </dl>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/stamp.js"></script>
</body>
</html>
