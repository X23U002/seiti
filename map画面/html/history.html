<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歴・ルート案内 - 聖地巡礼NAVI</title>
    <!-- cssフォルダにあるhistory.cssを読み込む -->
    <link rel="stylesheet" href="../css/history.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button class="back-btn" onclick="goToMyPage()">＜ 戻る</button>
        <h1>履歴・ルート案内</h1>
    </header>

    <div class="content">
        
        <!-- 現在のルート案内（タイムライン） -->
        <h2 class="section-title">📍 現在のルート</h2>
        <div class="timeline-container">
            
            <div class="timeline-node current">
                <div class="timeline-title">現在地</div>
                <div class="timeline-time">出発点</div>
            </div>
            
            <div class="timeline-node">
                <div class="timeline-title">〇〇神社</div>
                <div class="timeline-time">徒歩 8分 (14:30 着予定)</div>
            </div>
            
            <div class="timeline-node">
                <div class="timeline-title">〇〇駅</div>
                <div class="timeline-time">徒歩 15分 (14:45 着予定)</div>
            </div>
            
            <div class="timeline-node">
                <div class="timeline-title">〇〇広場</div>
                <div class="timeline-time">最終目的地 (15:00 着予定)</div>
            </div>
            
        </div>
        
        <button class="start-btn" onclick="startRoute()">案内開始</button>

        <!-- 過去の履歴リスト -->
        <h2 class="section-title" style="margin-top: 30px;">🕒 過去の巡礼履歴</h2>
        <div class="history-list">
            
            <div class="history-item">
                <div class="history-route">〇〇神社 ➔ 〇〇公園</div>
                <div class="history-date">2026年05月15日(金) 14:30</div>
            </div>
            
            <div class="history-item">
                <div class="history-route">〇〇公園 ➔ 〇〇広場</div>
                <div class="history-date">2026年05月15日(金) 16:00</div>
            </div>
            
            <div class="history-item">
                <div class="history-route">〇〇ベンチ ➔ 〇〇山</div>
                <div class="history-date">2026年05月02日(土) 11:15</div>
            </div>
            
            <div class="history-item">
                <div class="history-route">〇〇学校 ➔ 〇〇駅</div>
                <div class="history-date">2026年04月20日(月) 15:45</div>
            </div>
            
        </div>

    </div>

    <!-- jsフォルダにあるhistory.jsを読み込む -->
    <script src="../js/history.js"></script>
</body>
</html>
