<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お気に入り・ルート・履歴 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/history.css?v=2">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <a href="mypage.html" class="back-btn" aria-label="マイページに戻る">＜ 戻る</a>
        <h1>お気に入り・ルート・履歴</h1>
    </header>

    <main class="content">

        <!-- 読み込み中・未ログインの時 -->
        <div class="card empty-state" id="saved-notice">
            <div class="empty-state-icon">⏳</div>
            <p>読み込み中…</p>
        </div>

        <div id="saved-main" hidden>
            <!-- タブ -->
            <div class="saved-tabs" role="tablist" aria-label="表示する内容">
                <button type="button" class="saved-tab" role="tab" id="tab-favorites" aria-selected="true" aria-controls="panel-favorites">
                    お気に入り <span class="tab-count" id="count-favorites">0</span>
                </button>
                <button type="button" class="saved-tab" role="tab" id="tab-routes" aria-selected="false" aria-controls="panel-routes">
                    ルート <span class="tab-count" id="count-routes">0</span>
                </button>
                <button type="button" class="saved-tab" role="tab" id="tab-history" aria-selected="false" aria-controls="panel-history">
                    巡礼履歴 <span class="tab-count" id="count-history">0</span>
                </button>
            </div>

            <!-- お気に入りの聖地 -->
            <section id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites">
                <ul class="saved-list" id="favorite-list"></ul>
            </section>

            <!-- 保存したルート -->
            <section id="panel-routes" role="tabpanel" aria-labelledby="tab-routes" hidden>
                <ul class="saved-list" id="route-list"></ul>
            </section>

            <!-- 巡礼履歴（スタンプを取った聖地） -->
            <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
                <ul class="saved-list" id="history-list"></ul>
            </section>
        </div>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/toast.js"></script>
    <script type="module" src="../js/history.js?v=3"></script>
</body>
</html>
