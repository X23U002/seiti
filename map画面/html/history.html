<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歴・ルート案内 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/history.css">
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <button type="button" class="back-btn" onclick="goToMyPage()" aria-label="マイページに戻る">＜ 戻る</button>
        <h1>履歴・ルート案内</h1>
    </header>

    <main class="content">

        
           <!-- 現在のルート案内（タイムライン） -->
<section>
    <h2 class="section-title">
        <span aria-hidden="true">📍</span>
        現在のルート
    </h2>

    <!-- 選択した履歴のルートを表示する -->
    <ol
        class="timeline-container card"
        id="currentRouteTimeline"
    >
    </ol>

    <button
        type="button"
        class="btn btn-success"
        onclick="startRoute()"
    >
        ▶ 案内開始
    </button>
</section>

           

       
           <!-- 過去の履歴リスト -->
<section class="history-section">
    <h2 class="section-title">
        <span aria-hidden="true">🕒</span>
        過去の巡礼履歴
    </h2>

    <!-- JavaScriptで履歴を表示する -->
    <ul class="history-list" id="historyList">
    </ul>
</section>
        </section>

    </main>

    <script src="../js/common.js"></script>
    <script src="../js/history.js"></script>
</body>
</html>
