<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品一覧 - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css?v=c79053d9">
    <link rel="stylesheet" href="../css/tab-bar.css?v=77603899">
    <link rel="stylesheet" href="../css/work.css?v=60361a68">
    <!-- アプリとして使う（ホーム画面に追加・オフライン。pwa.js） -->
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0b3c5d">
    <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png">
    <script src="../js/pwa.js?v=99d6f0c1" defer></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <a href="map.html" class="back-btn" aria-label="マップに戻る">＜ マップ</a>
        <h1>作品一覧</h1>
    </header>

    <main class="content">
        <label class="work-search">
            <span class="visually-hidden">作品名で探す</span>
            <input type="search" id="work-search" placeholder="作品名で探す">
        </label>

        <!-- 読み込み中・読めなかった時 -->
        <div class="card empty-state is-loading" id="works-notice" role="status" aria-label="読み込み中">
            <!-- 読み込み中は、カードの形の影（スケルトン）をきらっと光らせる -->
            <span class="skeleton-line is-title"></span>
            <span class="skeleton-line"></span>
            <span class="skeleton-line"></span>
            <span class="skeleton-line is-short"></span>
        </div>

        <ul class="work-list" id="work-list" hidden></ul>
    </main>

    <script src="../js/common.js?v=bdcf06ca"></script>
    <script src="../js/tab-bar.js?v=48498a21"></script>
    <script type="module" src="../js/works.js?v=ac209ae0"></script>
</body>
</html>
