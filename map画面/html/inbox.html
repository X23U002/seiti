<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ - 聖地巡礼NAVI</title>
    <link rel="stylesheet" href="../css/common.css?v=c79053d9">
    <link rel="stylesheet" href="../css/tab-bar.css?v=77603899">
    <link rel="stylesheet" href="../css/inbox.css?v=7140b355">
    <!-- アプリとして使う（ホーム画面に追加・オフライン。pwa.js） -->
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0b3c5d">
    <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png">
    <script src="../js/pwa.js?v=c08113cc" defer></script>
</head>
<body>

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <a href="mypage.html" class="back-btn" aria-label="マイページに戻る">＜ 戻る</a>
        <h1>お知らせ</h1>
    </header>

    <main class="content">
        <p class="inbox-lead">お問い合わせへの返信や、聖地の登録申請の結果が届きます。</p>

        <!-- 読み込み中・未ログイン・空の時 -->
        <div class="card empty-state is-loading" id="inbox-notice" role="status" aria-label="読み込み中">
            <!-- 読み込み中は、カードの形の影（スケルトン）をきらっと光らせる -->
            <span class="skeleton-line is-title"></span>
            <span class="skeleton-line"></span>
            <span class="skeleton-line"></span>
            <span class="skeleton-line is-short"></span>
        </div>

        <ul class="inbox-list" id="inbox-list" hidden></ul>
    </main>

    <script src="../js/common.js?v=bdcf06ca"></script>
    <script src="../js/tab-bar.js?v=48498a21"></script>
    <script type="module" src="../js/inbox.js?v=c35fbc81"></script>
</body>
</html>
